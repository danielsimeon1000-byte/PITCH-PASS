<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pitch Pass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#140f1f; --ink:#f6efe4; --muted:#a99fb8; --ball:#ff8a2a; --good:#5ee39b; --bad:#ff5d6c;
    --wood:#c99a63; --panel:#1f1830; --line:rgba(255,255,255,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  #app{position:fixed;inset:0;display:flex;flex-direction:column}
  header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px;gap:8px}
  .brand{font-weight:800;font-size:18px;letter-spacing:-.02em}
  .brand span{color:var(--ball)}
  .stats{display:flex;gap:14px;font-size:12px;color:var(--muted)}
  .stats b{display:block;font-size:17px;color:var(--ink);font-weight:700;line-height:1.1}
  #stage{position:relative;flex:1;min-height:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #tuner{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(20,15,31,.75);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--muted);white-space:nowrap}
  #tuner b{color:var(--ink);font-weight:700}
  #phase{position:absolute;top:48px;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  #toast{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(.9);font-weight:800;font-size:30px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;text-align:center;text-shadow:0 4px 24px rgba(0,0,0,.5)}
  #toast small{display:block;font-size:14px;font-weight:500;color:var(--ink);opacity:.85;margin-top:4px}
  #toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  footer{display:flex;gap:8px;padding:10px 16px calc(14px + env(safe-area-inset-bottom))}
  button{font:inherit;border:0;border-radius:14px;padding:13px 16px;font-weight:700;font-size:15px;cursor:pointer;color:var(--ink);background:var(--panel);border:1px solid var(--line)}
  button.primary{background:var(--ball);color:#1b0f04;border:0}
  footer button{flex:1}
  #banner{display:none;margin:0 16px 6px;padding:9px 12px;border-radius:12px;background:#2a1f12;color:#f3d3a8;font-size:12.5px;line-height:1.35}
  /* start overlay */
  #start{position:fixed;inset:0;background:radial-gradient(120% 80% at 50% 0%,#2a1d45 0%,var(--bg) 60%);display:flex;flex-direction:column;justify-content:center;padding:28px 22px calc(28px + env(safe-area-inset-bottom));gap:18px;z-index:5;overflow:auto}
  #start h1{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:.95}
  #start h1 span{color:var(--ball)}
  #start p.lead{color:var(--muted);font-size:15px;line-height:1.45;max-width:420px}
  .group{display:flex;flex-direction:column;gap:7px}
  .group label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
  .seg button{flex:1;min-width:0;padding:10px 4px;font-size:13.5px;border:0;background:transparent;border-radius:10px;color:var(--muted)}
  .seg button.on{background:#352a52;color:var(--ink)}
  .seg button small{display:block;font-weight:500;font-size:10.5px;opacity:.7}
  .cta{display:flex;flex-direction:column;gap:8px;margin-top:6px}
  .cta button{padding:16px}
  .hint{font-size:12px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">Pitch<span>Pass</span></div>
    <div class="stats">
      <div>Score<b id="sScore">0</b></div>
      <div>Streak<b id="sStreak">0</b></div>
      <div>Accuracy<b id="sAcc">–</b></div>
    </div>
  </header>
  <div id="banner"></div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="tuner">Sing a note</div>
    <div id="phase"></div>
    <div id="toast"></div>
  </div>
  <footer>
    <button id="btnHear">🔊 Hear note</button>
    <button id="btnPause">Pause</button>
  </footer>
</div>

<div id="start">
  <div>
    <h1>Pitch<span>Pass</span></h1>
  </div>
  <p class="lead">Listen to the note, then sing it back. Your voice lifts the ball. Hit the pitch and it slips through the hole in the wall.</p>

  <div class="group">
    <label>Your voice</label>
    <div class="seg" data-key="range">
      <button data-v="48">Low<small>starts on C3</small></button>
      <button data-v="55">Mid<small>starts on G3</small></button>
      <button data-v="60" class="on">High<small>starts on C4</small></button>
    </div>
  </div>
  <div class="group">
    <label>Hole size</label>
    <div class="seg" data-key="tol">
      <button data-v="50" class="on">Easy<small>±50 cents</small></button>
      <button data-v="30">Trained<small>±30 cents</small></button>
      <button data-v="15">Perfect<small>±15 cents</small></button>
    </div>
  </div>
  <div class="group">
    <label>Mode</label>
    <div class="seg" data-key="mode">
      <button data-v="scale" class="on">Scale<small>Do to Do</small></button>
      <button data-v="random">Random<small>jumps</small></button>
      <button data-v="blind">By ear<small>no labels</small></button>
      <button data-v="runs">Runs<small>Pro preview</small></button>
    </div>
  </div>

  <div class="cta">
    <button class="primary" id="btnMic">🎤 Start singing</button>
    <button id="btnTouch">Play with touch instead</button>
    <div class="hint">Sing in a quiet room for the cleanest pitch reading. Any octave counts.</div>
  </div>
</div>

<script>
(() => {
  // ---------- config ----------
  const SOLF = ['Do','Re','Mi','Fa','Sol','La','Ti',"Do'"];
  const STEPS = [0,2,4,5,7,9,11,12];
  const SOLF_BY_SEMI = {0:'Do',2:'Re',4:'Mi',5:'Fa',7:'Sol',9:'La',11:'Ti',12:"Do'"};
  const NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  // Riffs and runs: pentatonic-based patterns, semitones above Do
  const RUNS = [
    [12,9,7,4,2,0],
    [7,9,7,4,2,0],
    [4,7,9,12,9,7],
    [0,2,4,7,4,2,0],
    [9,7,4,7,4,2,0],
    [12,11,9,7,9,7,4],
    [7,4,2,4,2,0],
    [2,4,7,9,7,4,2,0]
  ];
  const cfg = { range:60, tol:50, mode:'scale' };
  const TONE_LEN = 1.1;   // single-note reference length (s)
  const TRAVEL = 4.2;     // single-note wall travel time (s)
  const RUN_REF = 0.3;    // each note of a run reference (s)
  const RUN_GAP = 0.42;   // time between run walls when singing (s)
  const RUN_SPEED = 150;  // px per second for runs

  // ---------- dom ----------
  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d');
  const tuner = $('tuner'), phaseEl = $('phase'), toast = $('toast'), banner = $('banner');

  document.querySelectorAll('.seg').forEach(seg => {
    seg.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      seg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
      const v = b.dataset.v; cfg[seg.dataset.key] = isNaN(+v) ? v : +v;
    });
  });

  // ---------- audio ----------
  let ac = null, analyser = null, buf = null, micOn = false;
  let toneUntil = 0;
  const midiToHz = m => 440 * Math.pow(2, (m - 69) / 12);
  const hzToMidi = f => 69 + 12 * Math.log2(f / 440);
  const noteName = m => { const r = Math.round(m); return NAMES[((r % 12) + 12) % 12] + (Math.floor(r / 12) - 1); };

  function ensureAudio(){
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
  }
  function tone(midi, start, len, vol = 0.35){
    const o1 = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain(), g2 = ac.createGain();
    o1.type = 'triangle'; o2.type = 'sine';
    o1.frequency.value = midiToHz(midi); o2.frequency.value = midiToHz(midi) * 2;
    g2.gain.value = 0.18;
    o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(ac.destination);
    const rel = Math.min(0.25, len * 0.4);
    g.gain.setValueAtTime(0, start);
    g.gain.linearRampToValueAtTime(vol, start + 0.02);
    g.gain.setValueAtTime(vol, start + len - rel);
    g.gain.exponentialRampToValueAtTime(0.0001, start + len);
    o1.start(start); o2.start(start); o1.stop(start + len + 0.05); o2.stop(start + len + 0.05);
  }
  function playPhrase(notes, each){
    if (!ac) return;
    const t = ac.currentTime + 0.02;
    notes.forEach((m, i) => tone(m, t + i * each, each * (notes.length > 1 ? 0.95 : 1)));
    toneUntil = performance.now() + notes.length * each * 1000 + 140; // ignore the mic while the reference plays
  }
  function blip(ok){
    if (!ac) return;
    const t = ac.currentTime;
    const seq = ok ? [[84,0],[91,0.08]] : [[40,0]];
    seq.forEach(([m, d]) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = ok ? 'sine' : 'square';
      o.frequency.value = midiToHz(m);
      g.gain.setValueAtTime(0, t + d);
      g.gain.linearRampToValueAtTime(ok ? 0.12 : 0.07, t + d + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d + (ok ? 0.16 : 0.2));
      o.connect(g); g.connect(ac.destination); o.start(t + d); o.stop(t + d + 0.3);
    });
  }

  async function startMic(){
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('no-api');
      const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation:false, noiseSuppression:false, autoGainControl:false } });
      const src = ac.createMediaStreamSource(stream);
      analyser = ac.createAnalyser(); analyser.fftSize = 2048;
      buf = new Float32Array(analyser.fftSize);
      src.connect(analyser);
      micOn = true;
      return true;
    } catch (e) {
      banner.style.display = 'block';
      banner.textContent = "Mic isn't available on this page, so drag up and down to move the ball. To sing, open Pitch Pass from its https link (for example your Vercel link) in Chrome or Safari and allow the microphone.";
      return false;
    }
  }

  // Autocorrelation pitch detection, limited to the human singing range (70–1100 Hz)
  function detectPitch(){
    analyser.getFloatTimeDomainData(buf);
    const sr = ac.sampleRate; let n = buf.length, rms = 0;
    for (let i = 0; i < n; i++) rms += buf[i] * buf[i];
    rms = Math.sqrt(rms / n);
    if (rms < 0.012) return -1;
    let r1 = 0, r2 = n - 1; const th = 0.2;
    for (let i = 0; i < n / 2; i++) if (Math.abs(buf[i]) < th) { r1 = i; break; }
    for (let i = 1; i < n / 2; i++) if (Math.abs(buf[n - i]) < th) { r2 = n - i; break; }
    const b = buf.subarray(r1, r2); n = b.length;
    const minLag = Math.floor(sr / 1100), maxLag = Math.min(n - 2, Math.ceil(sr / 70));
    const c = new Float32Array(maxLag + 2);
    for (let lag = 0; lag <= maxLag + 1; lag++) {
      let s = 0; for (let j = 0; j < n - lag; j++) s += b[j] * b[j + lag]; c[lag] = s;
    }
    let d = 0; while (d < maxLag && c[d] > c[d + 1]) d++;
    let best = -1, pos = -1;
    for (let i = Math.max(d, minLag); i <= maxLag; i++) if (c[i] > best) { best = c[i]; pos = i; }
    if (pos <= 0 || best < c[0] * 0.3) return -1;
    const x1 = c[pos - 1], x2 = c[pos], x3 = c[pos + 1];
    const a = (x1 + x3 - 2 * x2) / 2, bb = (x3 - x1) / 2;
    const T0 = a ? pos - bb / (2 * a) : pos;
    return sr / T0;
  }

  // ---------- game state ----------
  let W = 0, H = 0, dpr = 1;
  let running = false, paused = false, touchMode = false;
  let phrase = null, seqIndex = 0, lastIdx = 0;
  let voiceMidi = null, voiceAt = 0, smooth = null, recent = [];
  let pointerDown = false;
  let ballY = 0, ballShake = 0, flash = 0, flashColor = '';
  let score = 0, streak = 0, hits = 0, tries = 0;
  const particles = [];

  const minM = () => cfg.range - 1.5;
  const maxM = () => cfg.range + 13.5;
  const TOP = 70, BOT = 30;
  const pxPerSemi = () => (H - TOP - BOT) / (maxM() - minM());
  const midiToY = m => TOP + (maxM() - m) * pxPerSemi();
  const yToMidi = y => maxM() - (y - TOP) / pxPerSemi();
  const ballX = () => Math.max(70, W * 0.28);
  const ballR = () => Math.min(16, Math.max(10, pxPerSemi() * 0.42));
  const isRun = () => cfg.mode === 'runs';

  function resize(){
    const r = cv.getBoundingClientRect(); dpr = Math.min(2, window.devicePixelRatio || 1);
    W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!ballY) ballY = H - BOT;
  }
  window.addEventListener('resize', resize);

  function nextIdx(){
    if (cfg.mode === 'scale') { const i = seqIndex % 8; seqIndex++; return i; }
    let i; do { i = Math.floor(Math.random() * 8); } while (i === lastIdx || Math.abs(i - lastIdx) > 5);
    return i;
  }

  // A phrase is one or more walls. Single modes: one wall. Runs: a fast row of thin walls.
  function spawnPhrase(){
    if (isRun()) {
      const pat = RUNS[Math.floor(Math.random() * RUNS.length)];
      const speed = RUN_SPEED, ww = 30;
      const refLen = pat.length * RUN_REF;
      const x0 = ballX() + speed * (refLen + 1.3);
      phrase = { speed, ww, run: true, walls: pat.map((s, i) => ({
        midi: cfg.range + s, label: SOLF_BY_SEMI[s] || '', x: x0 + i * speed * RUN_GAP, done: false, hit: false, best: null, heard: false
      })), hitCount: 0 };
      playPhrase(phrase.walls.map(w => w.midi), RUN_REF);
    } else {
      const idx = nextIdx(); lastIdx = idx;
      const speed = (W + 50 - ballX()) / TRAVEL;
      phrase = { speed, ww: Math.min(78, W * 0.2), run: false, walls: [{
        midi: cfg.range + STEPS[idx], label: SOLF[idx], x: W + 50, done: false, hit: false, best: null, heard: false
      }], hitCount: 0 };
      playPhrase([phrase.walls[0].midi], TONE_LEN);
    }
  }
  const activeWall = () => phrase && phrase.walls.find(w => !w.done);

  function showToast(html, color){
    toast.innerHTML = html; toast.style.color = color;
    toast.classList.add('show');
    clearTimeout(showToast.t); showToast.t = setTimeout(() => toast.classList.remove('show'), 1100);
  }
  function updateStats(){
    $('sScore').textContent = score;
    $('sStreak').textContent = streak;
    $('sAcc').textContent = tries ? Math.round(hits / tries * 100) + '%' : '–';
  }

  function judgeWall(w){
    w.done = true; tries++;
    const ok = w.hit;
    if (ok) {
      hits++; streak++; phrase.hitCount++;
      score += 100 + Math.max(0, cfg.tol - Math.abs(w.best || 0)) * 2 + streak * 10;
      blip(true);
      for (let i = 0; i < (phrase.run ? 8 : 26); i++) particles.push({ x: ballX(), y: ballY, vx: (Math.random() * 2 - .4) * 220, vy: (Math.random() * 2 - 1) * 220, life: 1 });
    } else {
      streak = 0; blip(false); ballShake = phrase.run ? 0.4 : 1;
    }
    if (!phrase.run) {
      flash = 1; flashColor = ok ? 'rgba(94,227,155,' : 'rgba(255,93,108,';
      if (ok) showToast(`${w.label} ✓<small>${w.best === 0 ? 'dead on' : (w.best > 0 ? '+' : '') + w.best} cents</small>`, 'var(--good)');
      else if (!w.heard) showToast("Didn't hear you", 'var(--bad)');
      else showToast(`${Math.abs(w.best)} cents ${w.best > 0 ? 'sharp' : 'flat'}<small>you sang ${noteName(w.midi + w.best / 100)}, target ${noteName(w.midi)}</small>`, 'var(--bad)');
    } else if (phrase.walls.every(x => x.done)) {
      const n = phrase.walls.length, k = phrase.hitCount;
      flash = 1; flashColor = k === n ? 'rgba(94,227,155,' : 'rgba(255,209,102,';
      if (k === n) score += 300;
      showToast(k === n ? `Clean run ✓<small>${n} of ${n} notes, +300 bonus</small>` : `Run ${k}/${n}<small>${k >= n - 1 ? 'so close, go again' : 'listen once more, then sing'}</small>`, k === n ? 'var(--good)' : '#ffd166');
    }
    updateStats();
  }

  // ---------- touch control ----------
  cv.addEventListener('pointerdown', e => { if (!touchMode) return; pointerDown = true; setFromPointer(e); });
  cv.addEventListener('pointermove', e => { if (touchMode && pointerDown) setFromPointer(e); });
  window.addEventListener('pointerup', () => pointerDown = false);
  function setFromPointer(e){
    const r = cv.getBoundingClientRect();
    voiceMidi = yToMidi(e.clientY - r.top); voiceAt = performance.now();
  }

  // ---------- drawing ----------
  function roundRect(x, y, w, h, r){
    if (h <= 0) return; r = Math.min(r, h / 2, w / 2);
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function woodPanel(x, y, w, h, seed){
    if (h <= 2) return;
    const g = ctx.createLinearGradient(x, 0, x + w, 0);
    g.addColorStop(0, '#b9854f'); g.addColorStop(.5, '#d6a870'); g.addColorStop(1, '#a87443');
    const rad = Math.min(8, w / 3);
    ctx.save(); roundRect(x, y, w, h, rad); ctx.fillStyle = g; ctx.fill(); ctx.clip();
    ctx.strokeStyle = 'rgba(90,50,20,.22)'; ctx.lineWidth = 1;
    const lines = Math.max(2, Math.floor(w / 13));
    for (let i = 0; i < lines; i++) {
      const gx = x + 4 + ((seed * 37 + i * 13) % Math.max(1, w - 8));
      ctx.beginPath(); ctx.moveTo(gx, y);
      for (let yy = y; yy < y + h; yy += 20) ctx.lineTo(gx + Math.sin((yy + seed * 50) / 40) * 2.5, yy);
      ctx.stroke();
    }
    ctx.restore();
    ctx.strokeStyle = 'rgba(0,0,0,.25)'; roundRect(x + .5, y + .5, w - 1, h - 1, rad); ctx.stroke();
  }

  function draw(dt){
    ctx.clearRect(0, 0, W, H);
    const blind = cfg.mode === 'blind';
    // lanes
    ctx.font = '600 12px "Bricolage Grotesque", sans-serif'; ctx.textBaseline = 'middle';
    for (let i = 0; i < 8; i++) {
      const y = midiToY(cfg.range + STEPS[i]);
      ctx.strokeStyle = 'rgba(255,255,255,.07)'; ctx.lineWidth = 1;
      ctx.setLineDash([4, 6]); ctx.beginPath(); ctx.moveTo(34, y); ctx.lineTo(W, y); ctx.stroke(); ctx.setLineDash([]);
      const t = blind ? '•' : SOLF[i];
      ctx.fillStyle = blind ? 'rgba(255,255,255,.18)' : 'rgba(255,255,255,.4)';
      ctx.fillText(t, 32 - ctx.measureText(t).width, y);
    }

    // walls
    const target = activeWall();
    if (phrase) {
      const ww = phrase.ww;
      // run guide line through the holes
      if (phrase.run) {
        ctx.strokeStyle = 'rgba(255,138,42,.25)'; ctx.lineWidth = 2; ctx.setLineDash([2, 5]);
        ctx.beginPath(); phrase.walls.forEach((w, i) => { const y = midiToY(w.midi); i ? ctx.lineTo(w.x, y) : ctx.moveTo(w.x, y); }); ctx.stroke(); ctx.setLineDash([]);
      }
      phrase.walls.forEach((w, i) => {
        if (w.x < -80 || w.x > W + 100) return;
        const x = w.x - ww / 2;
        const cy = midiToY(w.midi), half = (cfg.tol / 100) * pxPerSemi() + ballR() + 2;
        ctx.globalAlpha = w.done ? 0.55 : 1;
        woodPanel(x, -10, ww, cy - half + 10, i + 1);
        woodPanel(x, cy + half, ww, H - (cy + half) + 10, i + 7);
        if (w.done) { ctx.fillStyle = w.hit ? 'rgba(94,227,155,.35)' : 'rgba(255,93,108,.3)'; ctx.fillRect(x, cy - half, ww, half * 2); }
        else { ctx.fillStyle = 'rgba(255,255,255,.04)'; ctx.fillRect(x, cy - half, ww, half * 2); }
        const label = (blind && !w.done) ? '?' : w.label;
        ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
        ctx.font = phrase.run ? '800 13px "Bricolage Grotesque", sans-serif' : '800 22px "Bricolage Grotesque", sans-serif';
        ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 6;
        ctx.fillText(label, w.x, Math.max(20, cy - half - (phrase.run ? 14 : 26)));
        ctx.shadowBlur = 0; ctx.textAlign = 'left'; ctx.globalAlpha = 1;
      });
    }

    // left pitch meter (closeness to the next target)
    const mx = 8, mh = H - TOP - BOT;
    ctx.fillStyle = 'rgba(255,255,255,.06)'; roundRect(mx, TOP, 6, mh, 3); ctx.fill();
    const live = smooth != null && performance.now() - voiceAt < 300;
    if (target && live) {
      const off = Math.abs(smooth - target.midi) * 100;
      const pct = Math.max(0.05, 1 - off / 200);
      ctx.fillStyle = off <= cfg.tol ? '#5ee39b' : off <= cfg.tol * 2 ? '#ffd166' : '#ff5d6c';
      roundRect(mx, TOP + mh * (1 - pct), 6, mh * pct, 3); ctx.fill();
    }

    // ball
    const targetY = live ? midiToY(Math.max(minM(), Math.min(maxM(), smooth))) : H - BOT - ballR();
    ballY += (targetY - ballY) * Math.min(1, dt * (live ? 22 : 3));
    const shake = ballShake > 0 ? Math.sin(performance.now() / 18) * 6 * ballShake : 0;
    const r = ballR();
    let bx = ballX() + shake;
    if (phrase && !phrase.run) {
      const w = phrase.walls[0];
      if (w.done && !w.hit) bx = Math.max(r + 4, Math.min(bx, w.x - phrase.ww / 2 - r - 2));
    }
    const inTune = live && target && Math.abs(smooth - target.midi) * 100 <= cfg.tol;
    if (inTune) { ctx.fillStyle = 'rgba(94,227,155,.22)'; ctx.beginPath(); ctx.arc(bx, ballY, r * 1.9, 0, 7); ctx.fill(); }
    const bg = ctx.createRadialGradient(bx - r * .35, ballY - r * .35, r * .1, bx, ballY, r);
    bg.addColorStop(0, '#ffd2a3'); bg.addColorStop(.35, '#ff9a3c'); bg.addColorStop(1, '#e2620f');
    ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(bx, ballY, r, 0, 7); ctx.fill();

    // particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.life -= dt * 1.4;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      ctx.fillStyle = `rgba(94,227,155,${p.life})`; ctx.beginPath(); ctx.arc(p.x, p.y, 3 * p.life + 1, 0, 7); ctx.fill();
    }
    if (flash > 0) { ctx.fillStyle = flashColor + (flash * 0.12) + ')'; ctx.fillRect(0, 0, W, H); }
  }

  // ---------- loop ----------
  let last = performance.now();
  function frame(now){
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (running && !paused) {
      const tgt = activeWall();
      // voice input
      if (micOn && now > toneUntil) {
        const f = detectPitch();
        if (f > 0) {
          let m = hzToMidi(f);
          if (tgt) { while (m - tgt.midi > 6) m -= 12; while (tgt.midi - m > 6) m += 12; } // any octave counts
          recent.push(m); if (recent.length > (isRun() ? 3 : 5)) recent.shift();
          voiceMidi = [...recent].sort((a, b) => a - b)[recent.length >> 1];
          voiceAt = now;
        } else if (now - voiceAt > 200) recent = [];
      }
      const live = voiceMidi != null && now - voiceAt < 300;
      if (live) smooth = smooth == null ? voiceMidi : smooth + (voiceMidi - smooth) * Math.min(1, dt * (isRun() ? 24 : 14));

      if (!phrase) spawnPhrase();
      const bxp = ballX(), half = phrase.ww / 2 + ballR() * 0.5;
      phrase.walls.forEach(w => {
        w.x -= phrase.speed * dt;
        if (w.done) return;
        // scoring window: while the wall overlaps the ball
        if (Math.abs(w.x - bxp) <= half && live) {
          w.heard = true;
          const c = Math.round((smooth - w.midi) * 100);
          if (w.best == null || Math.abs(c) < Math.abs(w.best)) w.best = c;
          if (Math.abs(c) <= cfg.tol) w.hit = true;
        }
        if (w.x < bxp - half) judgeWall(w);
      });
      if (phrase.walls[phrase.walls.length - 1].x < -80) phrase = null;

      phaseEl.textContent = now < toneUntil ? (isRun() ? 'Listen to the run' : 'Listen') : (activeWall() ? 'Sing' : '');
      ballShake = Math.max(0, ballShake - dt * 2.5);
      flash = Math.max(0, flash - dt * 3);
    }
    // tuner readout
    const t = activeWall();
    if (smooth != null && now - voiceAt < 300) {
      const rr = Math.round(smooth), c = Math.round((smooth - rr) * 100);
      tuner.innerHTML = `You: <b>${noteName(smooth)}</b> ${c >= 0 ? '+' : ''}${c}c` + (t ? ` · Target: <b>${cfg.mode === 'blind' ? '?' : noteName(t.midi)}</b>` : '');
    } else tuner.innerHTML = touchMode ? 'Drag up and down to aim' : (micOn ? 'Waiting for your voice' : 'Sing a note');
    draw(running && !paused ? dt : 0);
    requestAnimationFrame(frame);
  }

  // ---------- start ----------
  async function begin(useMic){
    ensureAudio();
    $('start').style.display = 'none';
    resize();
    touchMode = !useMic;
    if (useMic) { const ok = await startMic(); if (!ok) touchMode = true; }
    seqIndex = 0; running = true;
    setTimeout(resize, 50);
  }
  $('btnMic').onclick = () => begin(true);
  $('btnTouch').onclick = () => begin(false);
  $('btnHear').onclick = () => {
    ensureAudio();
    if (!phrase) return;
    if (phrase.run) {
      // replay the run and give the singer time: push the unsung walls back
      const extra = phrase.walls.length * RUN_REF * phrase.speed;
      phrase.walls.forEach(w => { if (!w.done) w.x += extra; });
      playPhrase(phrase.walls.map(w => w.midi), RUN_REF);
    } else playPhrase([phrase.walls[0].midi], TONE_LEN);
  };
  $('btnPause').onclick = e => {
    paused = !paused; e.target.textContent = paused ? 'Resume' : 'Pause';
    phaseEl.textContent = paused ? 'Paused' : '';
  };

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
